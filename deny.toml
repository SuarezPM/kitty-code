[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
# vulnerability = "deny" — removed in cargo-deny >=0.15, now default (all vulns deny)
# SC-OPENSSF-7 spec: vulnerability = "deny", unmaintained = "warn" -> modern: workspace
yanked = "warn"
unmaintained = "workspace"
unsound = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MIT-0",
    "Unlicense",
]
confidence-threshold = 0.8
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
