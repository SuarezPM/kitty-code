[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
# vulnerability = "deny" — removed in cargo-deny >=0.15, now default (all vulns deny)
# SC-OPENSSF-7 spec: vulnerability = "deny", unmaintained = "warn" -> modern: workspace
yanked = "warn"
unmaintained = "workspace"
unsound = "workspace"
# T10.3: paste RUSTSEC-2024-0436 (unmaintained, sin upgrade seguro) es
# transitiva via engine/mistralrs (gemm/candle/tokenizers). Sin fix aguas
# arriba; se ignora el advisory con comentario, el gate sigue en deny para
# vulnerabilidades nuevas.
ignore = ["RUSTSEC-2024-0436"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MIT-0",
    "Unlicense",
    # T10.3 gap documentado (todas transitivas, OSI-approved, sin bajar el gate):
    # - 0BSD: doctest-file via interprocess via engine/mistralrs-core
    # - Zlib: foldhash via hashbrown (rusqlite/kitty-memory + engine)
    # - MPL-2.0: option-ext via ureq?/dirs via engine/candle (ver cargo-deny)
    "0BSD",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Mono M4: engine/ depends on candle via git pin (rev 35d7ae7, same rev the
# upstream baseline pins). Single allowed git source; anything else still denied.
allow-git = ["https://github.com/huggingface/candle"]
