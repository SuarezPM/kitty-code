[workspace]
resolver = "2"
members = [
    "crates/kitty-runtime",
    "crates/kitty-harness",
    "crates/kitty-memory",
    "crates/kitty-cli",
    # Mono M2 (ex kitty-infer workspace; mistralrs-cli dormant igual que en
    # origen — fuera de members hasta su cirugia serve/ui/agent):
    "engine/mistralrs",
    "engine/mistralrs-core",
    "engine/mistralrs-quant",
    "engine/mistralrs-paged-attn",
    "engine/mistralrs-metal-compile",
    "engine/mistralrs-flash-attn",
    "engine/mistralrs-macros",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SuarezPM/kitty-code"
readme = "README.md"
description = "Local coding agent for ornith:9B on consumer GPUs"
# Mono M2: metadatos que los crates engine/* heredan (.workspace). Solo
# afectan a engine/* (los crates kitty no heredan del workspace). Valores
# origen kitty-infer; version/description/repository/readme se conservan
# de Kitty-Code (destino manda) y engine fija los suyos por crate.
rust-version = "1.94"
keywords = ["llm", "inference", "machine-learning", "ai", "transformers"]
categories = ["science", "api-bindings", "text-processing"]
homepage = "https://github.com/EricLBuehler/mistral.rs"

[workspace.dependencies]
# Internal crates
kitty-runtime = { path = "crates/kitty-runtime" }
kitty-harness = { path = "crates/kitty-harness" }
kitty-memory = { path = "crates/kitty-memory" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Hashing
blake3 = "1"

# SQLite
rusqlite = { version = "0.40", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto (for blake3 hashing)
hex = "0.4"

# File globbing
glob = "0.3"

# Gitignore-aware directory walking
ignore = "0.4"

# Regex
regex = "1"

# Temp files for tests
tempfile = "3"

llama-cpp-2 = "0.1.154"

# F6.4 ADR-005 llama.cpp GBNF real adapter — wiring done; GO REVERTED 2026-08-21
# (empirical 94.0% baseline via gbnf-probe; lazy trigger {"name" is a no-op under
# Qwen2.5 tokenization — see docs/ADR-GBNF-GO.md).
# LlamaSampler::grammar + json_schema_to_grammar + grammar_lazy trigger ["{\"name\""] avoids HTTP 400.

# ── engine/ (mono M2, ex kitty-infer [workspace.dependencies]) ──
# Entradas Kitty-Code conservadas donde colisionan (ver notas M2 inline).
# candle-core = { version = "0.11.0" }
# candle-nn = { version = "0.11.0" }
# candle-flash-attn-v3 = { version = "0.11.0" }
# candle-metal-kernels = { version = "0.11.0" }
# candle-core = { path = "../candle/candle-core", version = "0.11.0" }
# candle-nn = { path = "../candle/candle-nn", version = "0.11.0" }
# candle-flash-attn-v3 = { path = "../candle/candle-flash-attn-v3", version = "0.11.0" }
# candle-metal-kernels = { path = "../candle/candle-metal-kernels", version = "0.11.0" }
candle-core = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", rev = "35d7ae7ca5c93e17c77359c3617376b8a72e96a4" }
candle-nn = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", rev = "35d7ae7ca5c93e17c77359c3617376b8a72e96a4" }
candle-flash-attn-v3 = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", rev = "35d7ae7ca5c93e17c77359c3617376b8a72e96a4" }
candle-metal-kernels = { git = "https://github.com/huggingface/candle.git", version = "0.11.0", rev = "35d7ae7ca5c93e17c77359c3617376b8a72e96a4" }

axum = "0.8.8"
http-body-util = "0.1.3"
mimalloc = "0.1"
# M2: anyhow = "1.0.100" — ya cubierto por la entrada Kitty-Code (compatible), no duplicado
# M2: serde = "1.0.228" — ya cubierto por la entrada Kitty-Code (compatible), no duplicado
# M2: serde_json = "1.0.149" — ya cubierto por la entrada Kitty-Code (compatible), no duplicado
sha2 = "0.10.9"
indexmap = { version = "2.13.0", features = ["serde"] }
either = { version = "1.15.0", features = ["serde"] }
accelerate-src = { version = "0.3.2" }
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"] }
# M2: tracing = "0.1.44" — ya cubierto por la entrada Kitty-Code (compatible), no duplicado
# M2: tracing-subscriber = { version = "0.3.22", features = ["env-filter"] } — ya cubierto por la entrada Kitty-Code (compatible), no duplicado
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
futures = "0.3"
# M2: clap origin con wrap_help — conservado Kitty-Code (derive); wrap_help sin uso en codigo engine (verificado), no duplicado
pyo3 = { version = "0.25.1", features = ["full", "extension-module", "either", "abi3-py310"] }
# M2: tokio 1.49 full+rt-multi-thread — cubierto por Kitty-Code "1"+full (full incluye rt-multi), no duplicado
# All features but avif, avif increases the msrv dramatically
image = { version = "0.25.9", default-features = false, features = [
    'bmp',
    'dds',
    'exr',
    'ff',
    'gif',
    'hdr',
    'ico',
    'jpeg',
    'png',
    'pnm',
    'qoi',
    'tga',
    'tiff',
    'webp',
] }
reqwest013 = { package = "reqwest", version = "0.13.1", default-features = false, features = [
    "blocking",
    "rustls",
    "charset",
    "http2",
]}
# DUAL reqwest con motivo (M2): kitty usa 0.12 (OllamaClient); engine usa 0.13
# (mistralrs + mistralrs-core). Majors distintos coexisten; unificar implicaria
# migrar un lado — fuera del alcance mecanico de M2.
base64 = "0.22.1"
# M2: tempfile = "3" — ya cubierto por la entrada Kitty-Code (compatible), no duplicado
half = "2.7.1"
rayon = "1.11.0"
url = "2.5.8"
utoipa = "5.4.0"
walkdir = "2.5.0"
data-url = "0.3.2"
float8 = "0.7.0"
# M2: regex = "1.12.2" — ya cubierto por la entrada Kitty-Code (compatible), no duplicado
fancy-regex = "0.14.0"
objc2-metal = "0.3.2"
objc2-foundation = "0.3.2"
dispatch2 = { version = "0.3.0", default-features = false, features = ["block2"] }
safetensors = "0.8.0"
toml = "0.9.11"
hf-hub = { version = "0.4.3", default-features = false, features = [
    "ureq",
    "tokio",
    "rustls-tls",
] }
itertools = "0.14.0"
rand09 = { package = "rand", version = "0.9.3" }
# DUAL rand con motivo (M2): kitty-cli usa 0.10 (BenchAb shuffle, seed 42);
# engine usa 0.9 (mistralrs + mistralrs-core, con rand_distr 0.5 / rand_isaac
# 0.4). Idem reqwest.
rand_distr = "0.5.1"
dirs = "6.0.0"
# M2: thiserror = "2.0.18" — ya cubierto por la entrada Kitty-Code (compatible), no duplicado
tokenizers = { version = "0.21.4", default-features = false }
tokio-tungstenite = "0.28.0"
tqdm = "0.8.0"
chrono = "0.4.43"
minijinja = { version = "2.14.0", features = ["builtins", "json", "preserve_order"] }
minijinja-contrib = { version = "2.14.0", features = ["pycompat"] }
regex-automata = { version = "0.4.13", features = ["meta"] }
rustc-hash = "2.1.1"
vob = "3.0.6"
cfgrammar = "0.14.1"
lrtable = "0.14.1"
galil-seiferas = "0.1.5"
radix_trie = "0.3.0"
bytemuck = "1.24.0"
tokio-rayon = "2.1.0"
rand_isaac = "0.4.0"
indicatif = { version = "0.18.3", features = ["rayon"] }
async-trait = "0.1.89"
strum = { version = "0.27.2", features = ["derive"] }
derive_more = { version = "2.1.1", default-features = false, features = ["from"] }
akin = "0.4.0"
variantly = "0.4.0"
derive-new = "0.7.0"
sysinfo = "0.36.1"
csv = "1.4.0"
bytemuck_derive = "1.10.2"
uuid = "1.19.0"
schemars = "1.2.0"
serde-saphyr = "0.0.16"
serde_plain = "1.0.2"
as-any = "0.3.2"
llguidance = { version = "1.2.0", default-features = false, features = ["lark"] }
toktrie_hf_tokenizers = "1.2.0"
toktrie = "1.4.0"
objc = { version = "0.2.7" }
serde-big-array = "0.5.1"
interprocess = "2.2.3"
urlencoding = "2.1.3"
scraper = "0.25.0"
html2text = "0.16.6"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
ordered-float = "5.1.0"
hashbrown = "0.16.1"
parking_lot = "0.12.5"
ahash = "0.8.12"
num-traits = "0.2.19"
libc = "0.2.180"
bm25 = "2.3.2"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac", "vorbis", "wav", "isomp4", "ogg", "pcm"] }
lazy_static = "1.5"
paste = "1.0.15"
byteorder = "1.5.0"
yoke = { version = "0.8.1", features = ["derive"] }
memmap2 = "0.9.9"
pyo3-build-config = "0.25.1"
ctrlc = "3.5.1"
directories = "6.0.0"
# Need to keep rustyline at 15.0.0 as 16.0.0 has a breaking change that conficts with `ctrlc`'s handling
rustyline = { version = "15.0.0", default-features = false, features = ["with-file-history"] }
tower-http = "0.6.8"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
futures-util = "0.3.31"
axum_static = "1.8.6"
mime_guess = "2.0.5"
include_dir = "0.7.4"
http = "1.4.0"
http-body = "1.0.1"
hyper = "1.8.1"
rust-mcp-schema = { version = "0.9.5", default-features = false, features = ["schema_utils", "latest"] }
cudaforge = "=0.1.6"
rubato = "0.16.2"
rustfft = "6.4.1"
hound = "3.5.1"
apodize = "1.0.0"
statrs = "0.18.0"
seccompiler = "0.5.0"
landlock = "0.4.4"
nix = { version = "0.31.3", default-features = false }
itoa = "1.0.18"
cutile = "=0.3.0"

mistralrs-core = { path = "engine/mistralrs-core", version = "0.9.3" }
mistralrs-paged-attn = { path = "engine/mistralrs-paged-attn", version = "0.9.3" }
mistralrs-metal-compile = { path = "engine/mistralrs-metal-compile", version = "0.9.3" }
mistralrs-flash-attn = { path = "engine/mistralrs-flash-attn", version = "0.9.3" }
mistralrs-quant = { path = "engine/mistralrs-quant", version = "0.9.3" }
mistralrs = { path = "engine/mistralrs", version = "0.9.3" }
mistralrs-macros = { path = "engine/mistralrs-macros", version = "0.9.3" }

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1
