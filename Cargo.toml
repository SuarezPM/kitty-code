[workspace]
resolver = "2"
members = [
    "crates/kitty-runtime",
    "crates/kitty-harness",
    "crates/kitty-memory",
    "crates/kitty-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SuarezPM/kitty-code"
readme = "README.md"
description = "Local coding agent for ornith:9B on consumer GPUs"

[workspace.dependencies]
# Internal crates
kitty-runtime = { path = "crates/kitty-runtime" }
kitty-harness = { path = "crates/kitty-harness" }
kitty-memory = { path = "crates/kitty-memory" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Hashing
blake3 = "1"

# SQLite
rusqlite = { version = "0.31", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto (for blake3 hashing)
hex = "0.4"

# File globbing
glob = "0.3"

# Gitignore-aware directory walking
ignore = "0.4"

# Regex
regex = "1"

# Temp files for tests
tempfile = "3"

rand = "0.8"

# F6.4 ADR-005 llama.cpp GBNF real adapter — defer spike (doc only, no dep added here).
# When GO (sub-2B tier requires >95% tool-call validity), add in-process adapter:
#   llama-cpp-2 = "0.1.154"  # LlamaSampler::grammar + json_schema_to_grammar + grammar_lazy
# Pitfall: custom grammar + tools exclusive → HTTP 400 (server-common.cpp:1289); use
# grammar_lazy triggers (PR #9639) — do NOT send grammar + tools together.
# Alternatives: llama-cpp-2 in-process (preferred) vs llama-server HTTP daemon (fallback).
# See docs/STRATEGY.md F6.4 ADR-005 and crates/kitty-runtime/src/grammar.rs:6-8.
# Decision: defer — keep post-hoc serde_json + required-field validation only.

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1
