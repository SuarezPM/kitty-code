name: Release

# Pass 3 Lane C — verificación local vs tag-only (2026-10-24):
#
# VERIFICABLE EN LOCAL sin push ni OIDC (verify local, no release E2E):
#   - `cargo build --locked --release -p kitty-cli --features tui` → dist/kittycode
#   - `(cd dist && sha256sum kittycode > kittycode.sha256)` + `sha256sum -c`
#   - `cargo cyclonedx --all-features --format json` (SBOM en seco; el workflow
#     usa cargo-cyclonedx 0.5.9 pinned) + check de que dist/*.cdx.json existe
#   - staging de assets (cp/ln). Todo lo anterior corre sin secretos.
#
# SOLO corre con push de tag `v*` (+ OIDC GitHub → Sigstore):
#   - `actions/attest-build-provenance` (necesita attestations: write + OIDC;
#     en local `gh attestation` no tiene nada que verificar sin release).
#   - `sigstore/cosign-installer` + `cosign sign-blob --yes` keyless (necesita
#     OIDC contra Rekor/Fulcio; fuera de Actions falla sin token efímero).
#   - `gh release create` (necesita GITHUB_TOKEN con contents: write sobre un
#     tag real; en local es dry-run como máximo con `gh release create --dry-run`
#     o no se ejecuta).
#   Conclusión: el E2E de release (attest/cosign/SLSA + publicación) NO es
#   reproducible en local ni en contenedor limpio; lo local cubre build+sha+SBOM.
#
# NOTA-REPO-PRIVADO: repo privado + sin tag pusheado ⇒ no hay release pública;
#   `curl|sh` (install.sh paso 1) es imposible hoy. Desbloqueo: 1) hacer público
#   el repo, 2) pushear tag v*, 3) este workflow publica assets, 4) curl|sh funciona.
#
# FIX 2026-10-24 (Lane C): el staging usaba `cp target/**/*.cdx.json` pero
#   cargo-cyclonedx 0.5.9 escribe junto a cada Cargo.toml (crates/*, engine/*),
#   0 matches bajo target/ ⇒ el guard "SBOM missing" mataba el job en el primer
#   tag push. Se cambió a `find crates engine -name '*.cdx.json' -exec cp`;
#   staging completo (build+sha+11 SBOM) re-verificado en local (ver STAGING OK).

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: write

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml pins the toolchain; rustup resolves it per-invocation.
  RUSTUP_TOOLCHAIN: stable

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - name: Install Rust toolchain (rustup, no archived actions)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Set SOURCE_DATE_EPOCH (reproducible builds)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: cargo build (release)
        run: cargo build --locked --release -p kitty-cli --features tui
      - name: Install cargo-cyclonedx
        run: cargo install --locked --version 0.5.9 cargo-cyclonedx
      # SBOM covers --all-features while the binary is default-features (deliberate, mirrors ci.yml).
      - name: Generate SBOM
        run: cargo cyclonedx --all-features --format json
      - name: Stage release assets
        run: |
          mkdir -p dist
          cp target/release/kittycode dist/kittycode
          (cd dist && sha256sum kittycode > kittycode.sha256)
          ln -sf kittycode dist/kitty
          ln -sf kittycode dist/kitty-cli
          # cargo-cyclonedx 0.5.9 escribe los *.cdx.json junto a cada Cargo.toml
          # (crates/*/*.cdx.json, engine/*/*.cdx.json), NO bajo target/ —
          # verificado en local 2026-10-24. Se recogen con find para que el
          # guard de abajo los vea (el glob anterior `target/**/*.cdx.json`
          # no copiaba nada y el job moría en "SBOM missing").
          find crates engine -name '*.cdx.json' -exec cp {} dist/ \;
          compgen -G "dist/*.cdx.json" > /dev/null || { echo "SBOM missing"; exit 1; }
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "dist/kittycode, dist/kittycode.sha256"
      - name: Install cosign (keyless, no secrets)
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
        with:
          # pin-everything: binario cosign 3.1.3 (versión con GHSA-fx35);
          # el pin v3.8.2 de arriba es solo la ACTION installer, no el binario.
          cosign-version: 3.1.3
      - name: Sign release assets (keyless, Rekor bundle)
        run: |
          shopt -s nullglob
          test -f dist/kittycode || { echo "binary missing"; exit 1; }
          test -f dist/kittycode.sha256 || { echo "sha256 missing"; exit 1; }
          for asset in dist/kittycode dist/kittycode.sha256 dist/*.cdx.json; do
            test -f "$asset" || continue
            test -L "$asset" && continue
            cosign sign-blob --yes \
              --bundle "${asset}.bundle" \
              --output-signature "${asset}.sig" \
              "${asset}"
          done
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes dist/kittycode dist/kittycode.sha256 dist/*.cdx.json dist/*.bundle dist/*.sig
