name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: github/codeql-action/init@49c5498669e3d9b1e47c6f6ad2a8d895c8c6a7b9 # v3.28.12
        with:
          languages: rust
      - uses: github/codeql-action/autobuild@49c5498669e3d9b1e47c6f6ad2a8d895c8c6a7b9 # v3.28.12
      - uses: github/codeql-action/analyze@49c5498669e3d9b1e47c6f6ad2a8d895c8c6a7b9 # v3.28.12
