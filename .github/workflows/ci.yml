name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Weekly dependency-advisory sweep (consumed by the `audit` job).
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml pins the toolchain; rustup resolves it per-invocation.
  RUSTUP_TOOLCHAIN: stable

jobs:
  test-cpu:
    name: test-cpu (default features, kitty suites)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b02b8e763ed2bdc05d6d33f3bb19 # v4.1.7
      - name: Install Rust toolchain (rustup, no archived actions)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      # Target cache (mono M4). Tag-pinned: substituting the verified SHA
      # needs network; the commit lane pins it like the rest below.
      - uses: Swatinem/rust-cache@v2 # M4-TODO: pin SHA
        with:
          shared-key: "mono-cpu"
      # Engine compile signal (lib+bins; engine TEST targets are pre-red in
      # origin — tracked, not gated here; see clippy job comment).
      - name: cargo check --workspace
        run: cargo check --workspace
      # Existing suites only (kitty-*): engine tests need models/network and
      # their test targets do not compile on default features (pre-existing).
      - name: cargo test (kitty suites)
        run: cargo test -p kitty-cli -p kitty-harness -p kitty-runtime -p kitty-memory

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b02b8e763ed2bdc05d6d33f3bb19 # v4.1.7
      - name: Install Rust toolchain (rustup, no archived actions)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@v2 # M4-TODO: pin SHA
        with:
          shared-key: "mono-cpu"
      # Fase 5.2 strict gate, scoped to kitty-* (green, proven): engine/ carries
      # ~373 pre-existing lints (upstream-derived style, incl. all-targets test
      # code that does not compile — pre-red in origin). Reformatting the fork
      # is out of scope; engine gets a compile signal from test-cpu instead.
      # Do NOT re-add --workspace/--all-features here without fixing engine first.
      - name: cargo clippy (strict, kitty-*)
        run: cargo clippy -p kitty-cli -p kitty-harness -p kitty-runtime -p kitty-memory --all-targets -- -D warnings

  cuda:
    name: cuda (sm_75, toolkit 12.9, toolchain 1.98.0)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: nvidia/cuda:12.9.1-devel-ubuntu24.04
      options: --gpus all
    env:
      # Playbook lane: CUDA builds pin 1.98.0 (verified local rustc 1.98.0),
      # overriding the repo-wide stable default above.
      RUSTUP_TOOLCHAIN: "1.98.0"
      DEBIAN_FRONTEND: noninteractive
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b02b8e763ed2bdc05d6d33f3bb19 # v4.1.7
      - name: Install Rust 1.98.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.98.0 --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      # CUDA 12.9 supports host compilers <= 14 (noble default gcc is 13;
      # gcc-14 exists as a package). nvcc rejects newer GCC (see guard #3909
      # playbook in engine/F0-RECON.md).
      - name: Install GCC 14
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc-14 g++-14 curl ca-certificates patch
      - uses: Swatinem/rust-cache@v2 # M4-TODO: pin SHA
        with:
          shared-key: "mono-cuda"
      # cudaforge kernel cache (cutile/cuda kernel artifacts live outside
      # target/). Tag-pinned like rust-cache above.
      - uses: actions/cache@v4 # M4-TODO: pin SHA
        with:
          path: ~/.cudaforge
          key: cudaforge-12.9-${{ hashFiles('Cargo.lock') }}
          restore-keys: cudaforge-12.9-
      # Guard candle#3909 (open upstream): backport persisted at
      # engine/docs/patches/candle-compatibility-cuh-3909.patch. Playbook
      # (engine/F0-RECON.md): after the first fetch materializes the
      # checkout, patch -p0 inside it; idempotent via pre-grep. Remove when
      # #3909 merges upstream (bump candle rev, delete the patch).
      - name: Apply guard candle#3909 (idempotent)
        run: |
          cargo fetch
          for d in "$HOME"/.cargo/git/checkouts/candle-*/35d7ae7/; do
            [ -d "$d" ] || continue
            if grep -q CANDLE_CUDA_VERSION "$d/candle-kernels/src/compatibility.cuh" 2>/dev/null; then
              echo "guard already applied in $d"
            else
              (cd "$d" && patch -p0 < "$GITHUB_WORKSPACE/engine/docs/patches/candle-compatibility-cuh-3909.patch")
              grep -q CANDLE_CUDA_VERSION "$d/candle-kernels/src/compatibility.cuh"
            fi
          done
      - name: nvidia-smi sanity
        run: nvidia-smi || true
      # Compile gates only (no model downloads, no test-run): the M3 feature
      # chain (kitty-infer-cuda -> mistralrs/cuda, internal path) plus the
      # engine cuda build itself. Runtime smoke stays lane-local (k5-style).
      - name: cargo check (cuda features)
        run: |
          cargo check -p kitty-runtime --features kitty-infer-cuda
          cargo check -p mistralrs-core --features cuda

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b02b8e763ed2bdc05d6d33f3bb19 # v4.1.7
      - name: Install Rust toolchain (rustup, no archived actions)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      # Scoped to kitty-* (green, proven): engine/ follows upstream-derived
      # style (~180 rustfmt diffs) and reformatting the fork is out of scope.
      - name: cargo fmt
        run: cargo fmt -p kitty-cli -p kitty-harness -p kitty-runtime -p kitty-memory -- --check

  deny:
    name: deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b02b8e763ed2bdc05d6d33f3bb19 # v4.1.7
      - uses: EmbarkStudios/cargo-deny-action@1ad33e49304de844c2c6cc106246e37cb1c21dc4e # v2.0.5
        with:
          command: check

  sbom:
    name: sbom (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b02b8e763ed2bdc05d6d33f3bb19 # v4.1.7
      - name: Install Rust toolchain (rustup, no archived actions)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx
      - name: Generate SBOM
        run: cargo cyclonedx --all-features --format json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: target/**/*.cdx.json

  coverage:
    name: coverage (kitty-harness ≥ 70%)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b02b8e763ed2bdc05d6d33f3bb19 # v4.1.7
      - name: Install Rust toolchain (rustup, no archived actions)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov
      # Mono M4: default features (was --all-features). Rationale: all-features
      # enables kitty-infer-cuda + llama-vulkan, which need an NVIDIA toolkit
      # and the Vulkan SDK — absent on ubuntu-latest, so the job could never
      # stay green. Watch-item: the 70% line was measured with all features;
      # re-baseline the threshold if the default-features number drifts.
      - name: Coverage gate
        run: cargo llvm-cov --package kitty-harness --summary-only --fail-under-lines 70

  audit:
    name: advisory audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Weekly sweep via the workflow-level `schedule` trigger; also runs on
    # every PR (audit is cheap and stricter than the spec minimum).
    steps:
      - uses: actions/checkout@11bd71901bbe5b02b8e763ed2bdc05d6d33f3bb19 # v4.1.7
      - name: Install Rust toolchain (rustup, no archived actions)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: cargo audit
        run: cargo audit
