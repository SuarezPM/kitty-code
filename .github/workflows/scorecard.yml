name: Scorecard

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b02b8e763ed2bdc05d6d33f3bb19 # v4.1.7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@05b42c6244331c54d2a233bba1c88c6d9970e45e8 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@49c5498669e3d9b1e47c6f6ad2a8d895c8c6a7b9 # v3.28.12
        with:
          sarif_file: results.sarif
