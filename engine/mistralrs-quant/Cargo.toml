[package]
name = "mistralrs-quant"
readme = "../README.md"
authors = ["Eric Buehler"]
version = "0.9.3"  # mono M2: identidad origen (workspace unificado es 0.1.0)
edition.workspace = true
rust-version.workspace = true
description = "kitty-infer: GGUF 1-35B text inference for `kitty run` (consumer GPU). Upstream MIT attribution in NOTICE."  # mono M2: idem version
repository = "https://github.com/EricLBuehler/mistral.rs"  # mono M2: idem version
keywords.workspace = true
categories.workspace = true
license = "MIT AND Apache-2.0"
homepage.workspace = true

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
half.workspace = true
serde.workspace = true
serde_json.workspace = true
lazy_static.workspace = true
paste.workspace = true
tracing.workspace = true
indicatif.workspace = true
indexmap.workspace = true
rayon.workspace = true
libc.workspace = true
byteorder.workspace = true
bytemuck.workspace = true
float8.workspace = true
objc2-metal = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
dispatch2 = { workspace = true, optional = true }
candle-metal-kernels = { workspace = true, optional = true }
thiserror.workspace = true
yoke.workspace = true
memmap2.workspace = true
safetensors.workspace = true
regex.workspace = true
fancy-regex.workspace = true
hf-hub.workspace = true
tokio.workspace = true
futures.workspace = true
sysinfo.workspace = true
cutile = { workspace = true, optional = true, features = ["experimental-tune"] }
mistralrs-metal-compile = { workspace = true, optional = true, features = ["metal"] }

[features]
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "dep:cudaforge"
]
cutile = [
    "cuda",
    "dep:cutile",
]
nccl = ["cuda", "candle-core/nccl"]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "dep:objc2-metal",
    "dep:objc2-foundation",
    "dep:dispatch2",
    "dep:candle-metal-kernels",
    "dep:mistralrs-metal-compile",
]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
arm-nightly-feat = []
ring = []

cuda-11040 = []
cuda-11050 = []
cuda-11060 = []
cuda-11070 = []
cuda-11080 = []
cuda-12000 = []
cuda-12010 = []
cuda-12020 = []
cuda-12030 = []
cuda-12040 = []
cuda-12050 = []
cuda-12060 = []
cuda-12080 = []
cuda-12090 = []
cuda-13000 = []
cuda-13010 = []
cuda-13020 = []
cuda-13030 = []

[build-dependencies]
cudaforge = { workspace = true, optional = true }
mistralrs-metal-compile = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[[example]]
name = "nvfp4_bench"
required-features = ["cuda", "cutile"]
