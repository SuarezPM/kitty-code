[package]
name = "mistralrs-macros"
readme = "../README.md"
authors = ["Eric Buehler"]
version = "0.9.3"  # mono M2: identidad origen (workspace unificado es 0.1.0)
edition.workspace = true
rust-version.workspace = true
description = "Proc macros for mistral.rs tool definitions"
repository = "https://github.com/EricLBuehler/mistral.rs"  # mono M2: idem version
keywords.workspace = true
categories.workspace = true
license.workspace = true
homepage.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
darling = "0.23"
