[package]
name = "mistralrs-core"
readme = "../README.md"
authors = ["Eric Buehler"]
version = "0.9.3"  # mono M2: identidad origen (workspace unificado es 0.1.0)
edition.workspace = true
rust-version.workspace = true
description = "kitty-infer: GGUF 1-35B text inference for `kitty run` (consumer GPU). Upstream MIT attribution in NOTICE."  # mono M2: idem version
repository = "https://github.com/EricLBuehler/mistral.rs"  # mono M2: idem version
keywords.workspace = true
categories.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
anyhow.workspace = true
candle-core.workspace = true
metrics.workspace = true
candle-nn.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
mistralrs-flash-attn = { workspace = true, optional = true }
dirs.workspace = true
hf-hub.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
tqdm.workspace = true
chrono.workspace = true
minijinja.workspace = true
minijinja-contrib.workspace = true
either.workspace = true
indexmap.workspace = true
mime_guess = { workspace = true }
half.workspace = true
accelerate-src = { workspace = true, optional = true }
intel-mkl-src = { workspace = true, optional = true }
tracing.workspace = true
rand09.workspace = true  # mono M2: DUAL rand (engine 0.9; kitty 0.8)
rand_distr.workspace = true
regex-automata.workspace = true
rustc-hash.workspace = true
vob.workspace = true
cfgrammar.workspace = true
lrtable.workspace = true
galil-seiferas.workspace = true
clap.workspace = true
radix_trie.workspace = true
bytemuck.workspace = true
rayon.workspace = true
tokio.workspace = true
tokio-rayon.workspace = true
rand_isaac.workspace = true
futures.workspace = true
pyo3 = { workspace = true, optional = true }
indicatif.workspace = true
async-trait.workspace = true
toml.workspace = true
strum.workspace = true
derive_more = { workspace = true}
akin.workspace = true
variantly.workspace = true
tracing-subscriber.workspace = true
derive-new.workspace = true
itertools.workspace = true
sysinfo.workspace = true
csv.workspace = true
reqwest013.workspace = true  # mono M2: DUAL reqwest (engine 0.13; kitty 0.12)
base64.workspace = true
bytemuck_derive.workspace = true
mistralrs-paged-attn = { workspace = true, optional = true }
mistralrs-quant.workspace = true
uuid = { workspace = true, features = ["v4"] }
utoipa = { workspace = true, optional = true }
schemars.workspace = true
serde-saphyr.workspace = true
regex.workspace = true
serde_plain.workspace = true
as-any.workspace = true
float8.workspace = true
llguidance.workspace = true
toktrie_hf_tokenizers.workspace = true
toktrie.workspace = true
candle-flash-attn-v3 = { workspace = true, optional = true }
safetensors.workspace = true
serde-big-array.workspace = true
interprocess.workspace = true
urlencoding.workspace = true
http.workspace = true
ordered-float.workspace = true
hashbrown.workspace = true
parking_lot.workspace = true
ahash.workspace = true
num-traits.workspace = true
libc.workspace = true
openai-harmony = "0.0.8"

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos"))'.dependencies]
objc = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
candle-metal-kernels = { workspace = true, optional = true }

[features]
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "dep:cudaforge",
    "mistralrs-quant/cuda",
    "dep:mistralrs-paged-attn",
    "mistralrs-paged-attn/cuda",
]
cudnn = ["candle-core/cudnn"]
cutile = ["cuda", "mistralrs-quant/cutile"]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "mistralrs-quant/metal",
    "dep:candle-metal-kernels",
    "dep:objc",
    "dep:mistralrs-paged-attn",
    "mistralrs-paged-attn/metal",
    "dep:objc2-metal"
]
flash-attn = ["cuda", "dep:mistralrs-flash-attn", "mistralrs-flash-attn/cuda"]
flash-attn-v3 = ["cuda", "dep:candle-flash-attn-v3"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "mistralrs-quant/accelerate"]
mkl = ["candle-core/mkl", "candle-nn/mkl"]
nccl = ["cuda", "mistralrs-quant/nccl"]
utoipa = ["dep:utoipa"]
ring = ["mistralrs-quant/ring"]
code-execution = []

[build-dependencies]
cudaforge = { workspace = true, optional = true }
