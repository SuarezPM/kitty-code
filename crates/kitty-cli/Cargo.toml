[package]
name = "kitty-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for Kitty Code"

[dependencies]
kitty-runtime.workspace = true
kitty-harness.workspace = true
kitty-memory.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# T1.4 (SDD-82-10 Q2): ref mecanica a la dep workspace; uso solo bajo cfg(tokio_unstable).
console-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
rand = "0.10"

[features]
default = []
tui = ["ratatui", "crossterm"]
# Embedded kitty-infer GGUF backend: `cargo check --features kitty-infer`
# (CPU-only here; CUDA builds are the kitty-infer lane).
kitty-infer = ["kitty-runtime/kitty-infer"]
kitty-infer-cuda = ["kitty-infer", "kitty-runtime/kitty-infer-cuda"]

[dependencies.ratatui]
version = "0.30"
optional = true

[dependencies.crossterm]
version = "0.29"
optional = true

# T1.4: declara la cfg custom de sesion (RUSTFLAGS="--cfg tokio_unstable")
# para que check/clippy no emitan unexpected_cfgs ni con ni sin la flag.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
