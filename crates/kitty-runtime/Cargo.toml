[package]
name = "kitty-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ollama/llama.cpp inference runtime for Kitty Code"

[dependencies]
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
llama = ["dep:llama-cpp-2"]
# GPU offload for the gbnf-probe measurement (needs Vulkan SDK headers +
# glslc at build time; RTX 2060S on this machine).
llama-vulkan = ["llama", "llama-cpp-2/vulkan"]

[dependencies.llama-cpp-2]
version = "0.1.154"
optional = true

[[bin]]
name = "gbnf-probe"
path = "src/bin/gbnf_probe.rs"
required-features = ["llama"]
