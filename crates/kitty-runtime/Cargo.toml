[package]
name = "kitty-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ollama/llama.cpp inference runtime for Kitty Code"

[dependencies]
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
llama = ["dep:llama-cpp-2"]
# Embedded kitty-infer GGUF backend (mono M2: engine/mistralrs interno,
# CPU-only here; CUDA builds are the kitty-infer lane). Opt-in so default
# builds stay light: `cargo check --features kitty-infer`.
kitty-infer = ["dep:mistralrs", "dep:anyhow"]
# GPU path: forwards CUDA into the internal mistralrs build (sm_75 lane).
# Default builds stay CPU-only; enable with --features kitty-infer-cuda.
kitty-infer-cuda = ["kitty-infer", "mistralrs/cuda"]
# GPU offload for the gbnf-probe measurement (needs Vulkan SDK headers +
# glslc at build time; RTX 2060S on this machine).
llama-vulkan = ["llama", "llama-cpp-2/vulkan"]

[dependencies.llama-cpp-2]
version = "0.1.154"
optional = true

[dependencies.mistralrs]
path = "../../engine/mistralrs"
optional = true

[dependencies.anyhow]
workspace = true
optional = true

[[bin]]
name = "gbnf-probe"
path = "src/bin/gbnf_probe.rs"
required-features = ["llama"]
