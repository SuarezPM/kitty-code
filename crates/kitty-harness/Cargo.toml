[package]
name = "kitty-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent loop, tools, hashline edits, parser, context budget for Kitty Code"

[dependencies]
kitty-runtime.workspace = true
kitty-memory.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
blake3.workspace = true
hex.workspace = true
glob.workspace = true
ignore.workspace = true
regex.workspace = true
toml = "0.8"

[features]
default = []
embedding = ["kitty-memory/embedding"]

# Real Linux containment (audit P0): Landlock FS whitelist + seccomp-bpf
# fail-closed allowlist + user/mount/PID namespaces. Versions matched to the
# verified Apohara Catalyst reference implementation.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30", features = ["sched", "user", "process"] }
seccompiler = { version = "0.5", features = ["json"] }
landlock = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
